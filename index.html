<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDM Maintenance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">

    <h1>🔧 Fiche de maintenance</h1>
  </header>

  <div class="container">
    <p class="info">* champs obligatoires</p>

    <div class="field-group">
      <label>Équipement <span class="req">*</span></label>
      <div class="field-wrap">
        <input type="text" style="display:none">
        <input type="text" id="equipement" name="random_12345_equipement"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               placeholder="Rechercher un équipement…">
        <div id="equipementList" class="dropdown"></div>
      </div>
    </div>

    <div class="field-group">
      <label>Description <span class="req">*</span></label>
      <textarea id="description" placeholder="Décrire le problème…"></textarea>
    </div>

    <div class="field-group">
      <label>Date <span class="req">*</span></label>
      <input type="date" id="date">
    </div>

    <div class="field-group">
      <label>Site <span class="req">*</span></label>
      <div class="field-wrap">
        <input type="text" style="display:none">
        <input type="text" id="site" name="random_12345_site"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               placeholder="Rechercher un site…">
        <div id="siteList" class="dropdown"></div>
      </div>
    </div>

    <div class="field-group">
      <label>Matériel utilisable ? <span class="req">*</span></label>
      <div class="choice-group">
        <button type="button" onclick="selectMateriel('Oui', this)">Oui</button>
        <button type="button" onclick="selectMateriel('Oui en mode dégradé', this)">Oui, dégradé</button>
        <button type="button" onclick="selectMateriel('Non', this)">Non</button>
      </div>
      <input type="hidden" id="materiel">
    </div>

    <div class="field-group">
      <label>Action immédiate</label>
      <textarea id="action1" placeholder="Action corrective immédiate…"></textarea>
    </div>

    <div class="field-group">
      <label>Action à effectuer</label>
      <textarea id="action2" placeholder="Action à prévoir…"></textarea>
    </div>

    <div class="field-group">
      <label>Rédacteur <span class="req">*</span></label>
      <input type="text" id="redacteur" placeholder="Votre nom">
    </div>

    <button class="btn" onclick="envoyer()">✅ Envoyer</button>
  </div>

<script>
// Ignorer accents
function normalize(str) {
return str
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "");
}
//Fuzzy
function editDistance(a, b) {
  const dp = [];
  for (let i = 0; i <= a.length; i++) {
    dp[i] = [];
    dp[i][0] = i;
  }
  for (let j = 0; j <= b.length; j++) {
    dp[0][j] = j;
  }
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
      // Tolérance inversion de deux lettres
      if (
        i > 1 &&
        j > 1 &&
        a[i - 1] === b[j - 2] &&
        a[i - 2] === b[j - 1]
      ) {
        dp[i][j] = Math.min(dp[i][j], dp[i - 2][j - 2] + 1);
      }
    }
  }
  return dp[a.length][b.length];
}
function wordScore(searchWord, targetWord) {
  if (!searchWord) return 1;
  if (targetWord === searchWord) return 120;
  if (targetWord.startsWith(searchWord)) return 100;
  if (targetWord.includes(searchWord)) return 80;
  // On compare aussi avec le début du mot cible
  const targetPrefix = targetWord.substring(0, searchWord.length);
  const distFull = editDistance(searchWord, targetWord);
  const distPrefix = editDistance(searchWord, targetPrefix);
  const dist = Math.min(distFull, distPrefix);
  let threshold = 0;
  if (searchWord.length <= 3) {
    threshold = 0;
  } else if (searchWord.length <= 5) {
    threshold = 1;
  } else if (searchWord.length <= 9) {
    threshold = 2;
  } else {
    threshold = 3;
  }
  if (dist <= threshold) {
    return 60 - dist * 10;
  }
  return 0;
}
function itemScore(search, item) {
  const query = normalize(search);
  const text = normalize(item);
  if (!query) return 1;
  const queryWords = query.split(/\s+/).filter(Boolean);
  const textWords = text.split(/\s+/).filter(Boolean);
  let totalScore = 0;
  for (const qWord of queryWords) {
    let bestWordScore = 0;
    for (const tWord of textWords) {
      const score = wordScore(qWord, tWord);
      if (score > bestWordScore) {
        bestWordScore = score;
      }
    }
    // Si un des mots tapés ne matche rien, on rejette l'élément
    if (bestWordScore === 0) {
      return 0;
    }
    totalScore += bestWordScore;
  }
  // Bonus si la chaîne complète commence pareil
  if (text.startsWith(query)) {
    totalScore += 50;
  }
  // Bonus si la chaîne complète contient la recherche
  if (text.includes(query)) {
    totalScore += 30;
  }
  return totalScore;
}
// ✅ globals
let equipements = [];
let sites = [];
// ✅ sélection matériel
function selectMateriel(value, element) {
  document.getElementById("materiel").value = value;
  document.querySelectorAll(".choice-group button")
    .forEach(btn => btn.classList.remove("active"));
  element.classList.add("active");
}
// ✅ AUTOCOMPLETE
function createAutocomplete(inputId, listId, dataList) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  input.addEventListener("focus", () => showList(""));
  input.addEventListener("input", () => showList(input.value));
function showList(filter) {
  const val = normalize(filter);
  let results = dataList.map(item => ({
    original: item,
    score: itemScore(val, item)
  }));
  results = results.filter(r => r.score > 0);
  results.sort((a, b) => {
    if (b.score !== a.score) {
      return b.score - a.score;
    }
    return a.original.localeCompare(b.original);
  });
  results = results.slice(0, 100);
  if (results.length === 0) {
    list.innerHTML = "<div>Aucun résultat</div>";
  } else {
    list.innerHTML = results.map(item => `
      <div onclick="selectItem('${item.original.replace(/'/g, "\\'")}', '${inputId}', '${listId}')">
        ${item.original}
      </div>
    `).join("");
  }
  list.style.display = "block";
}
}
// ✅ sélection item
function selectItem(value, inputId, listId) {
  document.getElementById(inputId).value = value;
  document.getElementById(listId).style.display = "none";
}
// ✅ charger données
Promise.all([
  fetch("equipements.json").then(res => res.json()),
  fetch("sites.json").then(res => res.json())
]).then(([equipData, siteData]) => {
  equipements = equipData;
  sites = siteData;
  createAutocomplete("equipement", "equipementList", equipements);
  createAutocomplete("site", "siteList", sites);
});
// ✅ fermer dropdown
document.addEventListener("click", function(e) {
  if (!e.target.closest(".field-wrap")) {
    document.querySelectorAll(".dropdown")
      .forEach(d => d.style.display = "none");
  }
});
// ✅ auto date
window.onload = function() {
  document.getElementById("date").valueAsDate = new Date();
};
// ✅ ENVOI
function envoyer() {
  const equipement = document.getElementById("equipement").value;
  const description = document.getElementById("description").value;
  const date = document.getElementById("date").value;
  const site = document.getElementById("site").value;
  const materiel = document.getElementById("materiel").value;
  const action1 = document.getElementById("action1").value;
  const action2 = document.getElementById("action2").value;
  const redacteur = document.getElementById("redacteur").value;
  if (!equipement || !description || !date || !site || !materiel || !redacteur) {
    alert("⚠️ Champs obligatoires manquants");
    return;
  }
  if (!confirm("✅ Confirmer l'envoi ?")) return;
  let baseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=esFuUS-5i0OFlOEbb2vseRjkMUtrzTFJgkDRO6ovM4RUQzRENktIUTY4V0YwUFVVQ01QSlk5WkVPWC4u";
  let url = baseUrl
    + "&r6224cbff49d94b79a69654caa3241ddf=" + encodeURIComponent(equipement)
    + "&r936dbfbe7b3a4f0ba57f4406807e37a5=" + encodeURIComponent(description)
    + "&rb1e2f7df928f43beacbe59f537d8b09b=" + encodeURIComponent(date)
    + "&r3fedaea8875d40899833d017ba9ff9fa=" + encodeURIComponent(site)
    + "&r9ac54388070a43748ea2b5514ff712d8=" + encodeURIComponent(materiel)
    + "&ra23df662a36640e2912b5bed96b080ee=" + encodeURIComponent(action1)
    + "&rdd29c9cd9da649e8a41549e52d9f6374=" + encodeURIComponent(action2)
    + "&r38c32352ebca4f7e88f37c0de9bf0bf0=" + encodeURIComponent(redacteur);
  window.location.href = url;
}
</script>
</body>
</html>

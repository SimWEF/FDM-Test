<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Etat du matériel</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f8;
    padding:15px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.nom{
    font-size:18px;
    font-weight:bold;
}

.dispo{
    font-size:16px;
    margin-top:5px;
}

.etat{
    margin-top:8px;
    font-size:24px;
}

</style>

</head>
<body>

<h2>📊 Etat du matériel</h2>

<div id="listeSousEnsembles"></div>

<script>

fetch("sousEnsemble.json")
.then(r => r.json())
.then(data => {

    const container =
        document.getElementById("listeSousEnsembles");

    data.forEach(item => {

        let couleur = "⚪";

        if(item.etat === "VERT")
            couleur = "🟢";

        if(item.etat === "ORANGE")
            couleur = "🟠";

        if(item.etat === "ROUGE")
            couleur = "🔴";

        container.innerHTML += `
            <div class="card">

                <div class="nom">
                    ${item.nom}
                </div>

                <div class="dispo">
                    ${item.utilisables}/${item.total}
                </div>

                <div class="etat">
                    ${couleur}
                </div>

            </div>
        `;
    });

});

</script>

</body>
</html>
